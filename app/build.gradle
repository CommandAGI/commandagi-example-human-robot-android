plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.commandagi.humanrobot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.commandagi.humanrobot'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'

        // Optional pre-configuration: build with
        //   ./gradlew assembleDebug -PcommandagiApiKey=cagi_… [-PcommandagiBaseUrl=…]
        // to bake the key in (so the app auto-connects with no in-app setup). Defaults are empty →
        // the app prompts for the key in Settings. Never commit a real key.
        buildConfigField "String", "COMMANDAGI_API_KEY", "\"${project.findProperty('commandagiApiKey') ?: ''}\""
        buildConfigField "String", "COMMANDAGI_BASE_URL", "\"${project.findProperty('commandagiBaseUrl') ?: 'https://api.commandagi.com'}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
